<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="fase2.css">
</head>
<body>
    <h1>As 4 Operações</h1>
    <div class="memory-game" id="memory-game">
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">4 + 4</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">5 - 3</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">2 + 2</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">7 + 3</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">12 - 3</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">10 : 2</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">1 x 1</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">7 + 7</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">4 x 2</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">1 + 1</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">3 + 1</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">20 : 2</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">3 x 3</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">3 + 2</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">0 + 1</span>
        </div>
        <div class="card" onclick="flipCard(this)">
            <span class="card-text">7 x 2</span>
        </div>
    </div>
    </div>

    <div class="buttons-container">
        <a class="voltar" href="/index.html">Voltar ao Início</a>
        <button class="restart-btn" onclick="reiniciarJogo()">Reiniciar Jogo</button>
        <a class="proxima_fase" href="/fase 3/fase3.html">Próxima Fase</a>
    </div>

    <script>
        let flippedCards = [];
        let matchedCards = [];

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains('flipped') && !matchedCards.includes(card)) {
                card.classList.add('flipped');
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    setTimeout(checkMatch, 1000);
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;

            const value1 = evaluateCard(card1.innerText.trim());
            const value2 = evaluateCard(card2.innerText.trim());

            if (value1 === value2) {
                matchedCards.push(card1, card2);
            } else {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
            }

            flippedCards = [];
        }

        // Esta função tenta avaliar o conteúdo da carta
        function evaluateCard(text) {
            try {
                // Substitui "x" por "*" e ":" por "/"
                const sanitized = text.replace(/x/g, '*').replace(/:/g, '/');
                return eval(sanitized);
            } catch {
                return text; // se der erro, volta o próprio texto
            }
        }


        function reiniciarJogo() {
            const cards = document.querySelectorAll('.card');
            const shuffledCards = shuffle([...cards]);

            shuffledCards.forEach((card, index) => {
                card.style.order = index;
                card.classList.remove('flipped'); // Vira as cartas para baixo
            });

            matchedCards = [];
            flippedCards = [];
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    </script>
</body>
</html>
